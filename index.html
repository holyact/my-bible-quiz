<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Bible Quiz - NIV Verses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .quiz-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md bg-white rounded-3xl quiz-card p-8 fade-in">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-600 mb-2">Bible Quiz (NIV)</h1>
            <p class="text-gray-500 text-sm">Fill in the blanks with hints</p>
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 h-2 rounded-full mt-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Quiz Content Section -->
        <div id="quiz-container">
            <!-- Verse Text -->
            <div id="verse-display" class="mb-6 leading-relaxed text-lg text-gray-800 italic text-center min-h-[140px] flex flex-col justify-center">
                <!-- Verse will be injected here -->
            </div>

            <!-- Input Area -->
            <div class="space-y-4">
                <input type="text" id="answer-input" 
                       class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:border-blue-500 focus:outline-none transition-colors text-center text-lg"
                       placeholder="Type the word" autocomplete="off">
                
                <div class="flex gap-2">
                    <button onclick="showHint()" 
                            class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold py-3 rounded-xl transition-all">
                        💡 Hint
                    </button>
                    <button onclick="checkAnswer()" 
                            class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all active:scale-95">
                        Check Answer
                    </button>
                </div>
            </div>

            <!-- Hint & Feedback Message -->
            <div id="hint-text" class="mt-4 text-center text-sm text-amber-600 font-medium min-h-[1.2rem]"></div>
            <div id="feedback" class="mt-2 text-center font-semibold min-h-[1.5rem]"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-container" class="hidden text-center space-y-6">
            <div class="text-5xl">🎉</div>
            <h2 class="text-2xl font-bold">Great Job!</h2>
            <p class="text-gray-600">You've completed the quiz.</p>
            <div class="bg-blue-50 p-4 rounded-2xl">
                <p class="text-blue-800 font-bold text-xl">Score: <span id="final-score">0</span> / <span id="total-count">0</span></p>
            </div>
            <button onclick="restartQuiz()" 
                    class="w-full bg-gray-800 hover:bg-black text-white font-bold py-3 rounded-xl transition-all">
                Try Again
            </button>
        </div>
    </div>

    <script>
        const bibleQuizzes = [
            {
                verse: '"For God so _______ the world that he gave his one and only Son..."',
                answer: 'loved',
                ref: 'John 3:16',
                hint: 'A strong feeling of deep affection (Starts with "L")'
            },
            {
                verse: '"In the beginning God _______ the heavens and the earth."',
                answer: 'created',
                ref: 'Genesis 1:1',
                hint: 'To make something out of nothing (Starts with "C")'
            },
            {
                verse: '"I can do all this through him who gives me _______."',
                answer: 'strength',
                ref: 'Philippians 4:13',
                hint: 'The quality of being physically or mentally strong (Starts with "S")'
            },
            {
                verse: '"The Lord is my _______, I lack nothing."',
                answer: 'shepherd',
                ref: 'Psalm 23:1',
                hint: 'A person who looks after sheep'
            },
            {
                verse: '"Trust in the Lord with all your heart and lean not on your own _______."',
                answer: 'understanding',
                ref: 'Proverbs 3:5',
                hint: 'The ability to comprehend something'
            },
            {
                verse: '"And we know that in all things God works for the _______ of those who love him."',
                answer: 'good',
                ref: 'Romans 8:28',
                hint: 'Something that is beneficial or virtuous'
            },
            {
                verse: '"Therefore go and make _______ of all nations..."',
                answer: 'disciples',
                ref: 'Matthew 28:19',
                hint: 'Followers or students of a teacher (Starts with "D")'
            },
            {
                verse: '"For it is by _______ you have been saved, through faith..."',
                answer: 'grace',
                ref: 'Ephesians 2:8',
                hint: 'The free and unmerited favor of God (Starts with "G")'
            },
            {
                verse: '"So do not _______, for I am with you; do not be dismayed, for I am your God."',
                answer: 'fear',
                ref: 'Isaiah 41:10',
                hint: 'To be afraid of something'
            },
            {
                verse: '"Be strong and _______ . Do not be afraid; do not be discouraged..."',
                answer: 'courageous',
                ref: 'Joshua 1:9',
                hint: 'Brave, not deterred by danger (Starts with "C")'
            },
            // --- New Verses Added Below ---
            {
                verse: '"I can do all this through him who gives me _______."',
                answer: 'strength',
                ref: 'Philippians 4:13',
                hint: 'Power or energy to do something (Starts with "S")'
            },
            {
                verse: '"_______ in the Lord with all your heart."',
                answer: 'Trust',
                ref: 'Proverbs 3:5',
                hint: 'To believe in the reliability or truth of someone (Starts with "T")'
            },
            {
                verse: '"You are the _______ of the world."',
                answer: 'light',
                ref: 'Matthew 5:14',
                hint: 'The natural agent that stimulates sight and makes things visible'
            }
        ];

        let currentIndex = 0;
        let score = 0;

        const verseDisplay = document.getElementById('verse-display');
        const answerInput = document.getElementById('answer-input');
        const feedback = document.getElementById('feedback');
        const hintText = document.getElementById('hint-text');
        const progressBar = document.getElementById('progress-bar');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const finalScoreDisplay = document.getElementById('final-score');
        const totalCountDisplay = document.getElementById('total-count');

        function initQuiz() {
            currentIndex = 0;
            score = 0;
            totalCountDisplay.textContent = bibleQuizzes.length;
            quizContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            showQuestion();
        }

        function showQuestion() {
            const currentQuiz = bibleQuizzes[currentIndex];
            verseDisplay.innerHTML = `
                <p class="mb-2 text-xl">${currentQuiz.verse}</p>
                <span class="text-sm font-semibold text-gray-400 not-italic">- ${currentQuiz.ref}</span>
            `;
            answerInput.value = '';
            answerInput.focus();
            feedback.textContent = '';
            hintText.textContent = ''; 
            updateProgress();
        }

        function showHint() {
            const currentQuiz = bibleQuizzes[currentIndex];
            hintText.textContent = `Hint: ${currentQuiz.hint}`;
            hintText.classList.add('fade-in');
        }

        function updateProgress() {
            const progress = (currentIndex / bibleQuizzes.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function checkAnswer() {
            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = bibleQuizzes[currentIndex].answer.toLowerCase();

            if (userAnswer === '') return;

            if (userAnswer === correctAnswer) {
                score++;
                feedback.textContent = "✨ Correct!";
                feedback.className = "mt-2 text-center font-semibold text-green-500 fade-in";
            } else {
                feedback.textContent = `❌ Incorrect. (Answer: ${bibleQuizzes[currentIndex].answer})`;
                feedback.className = "mt-2 text-center font-semibold text-red-500 fade-in";
            }

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < bibleQuizzes.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        }

        function showResult() {
            progressBar.style.width = '100%';
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            finalScoreDisplay.textContent = score;
        }

        function restartQuiz() {
            initQuiz();
        }

        answerInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        window.onload = initQuiz;
    </script>
</body>
</html>
